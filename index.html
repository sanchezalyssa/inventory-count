<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICT Inventory Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14181c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ICT Inventory">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#f2eefc; --surface:#ffffff; --surface-2:#f1ecfb; --border:#e1d7f7;
  --text:#241b3d; --text-dim:#7a6fa0; --accent:#7c3aed; --accent-dim:#a78bfa;
  --danger:#e0605a; --ok:#3fae6c;
  --page-grad:linear-gradient(160deg,#c9b8f5 0%,#efe8fc 55%,#f7f4fd 100%);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1730; --surface:#251f3d; --surface-2:#2f2750; --border:#453a6e;
    --text:#f0ecfb; --text-dim:#b3a6d9; --accent:#a78bfa; --accent-dim:#7c3aed;
    --page-grad:linear-gradient(160deg,#2a2150 0%,#1c1730 60%,#1c1730 100%);
  }
}
:root[data-theme="dark"]{
  --bg:#1c1730; --surface:#251f3d; --surface-2:#2f2750; --border:#453a6e;
  --text:#f0ecfb; --text-dim:#b3a6d9; --accent:#a78bfa; --accent-dim:#7c3aed;
  --page-grad:linear-gradient(160deg,#2a2150 0%,#1c1730 60%,#1c1730 100%);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; text-size-adjust:100%;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Poppins','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  font-size:clamp(14px, 0.6vw + 13px, 14.5px); line-height:1.5;
  letter-spacing:.005em; font-weight:400;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;
  display:flex; flex-direction:column; min-height:100%;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace; font-variant-numeric:tabular-nums;}
td.qty,.statn,.total b,.overview-row .n{font-variant-numeric:tabular-nums;}
header{
  padding:16px 20px; padding-top:calc(16px + env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:14px;
  flex-wrap:wrap; background:var(--surface);
}
header h1{font-size:clamp(15px, 2.2vw, 17px); margin:0; font-weight:600; letter-spacing:.1px;}
header .stamp{
  font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--accent);
  border:1px solid var(--accent-dim); padding:2px 7px; border-radius:3px;
}
.tabs{display:flex; gap:2px; margin-left:auto;}
.tab{
  padding:7px 14px; font-size:13px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text-dim); cursor:pointer; border-radius:4px;
}
.tab.active{color:var(--text); border-color:var(--accent-dim); background:var(--surface);}
.userbadge{
  display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text-dim);
}
.userbadge b{color:var(--text); font-weight:600;}
.logoutbtn{
  padding:5px 11px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
  border-radius:4px; cursor:pointer; font-size:12px;
}
.logoutbtn:hover{color:var(--danger); border-color:var(--danger);}
.exportbtn{padding:6px 12px; background:var(--accent); color:#14181c; border:none; border-radius:4px; cursor:pointer; font-size:12.5px; font-weight:600;}
.exportbtn:disabled{opacity:.6; cursor:wait;}
main{flex:1; display:flex; min-height:0; overflow:hidden;}
.rail{
  width:230px; min-width:170px; border-right:1px solid var(--border); background:var(--surface);
  display:flex; flex-direction:column; overflow:hidden;
}
.rail input{
  margin:10px; padding:8px 10px; background:var(--surface-2); border:1px solid var(--border);
  color:var(--text); border-radius:4px; font-size:13px; font-family:inherit;
}
.branchlist{overflow-y:auto; flex:1;}
.branchrow{
  padding:10px 14px; font-size:14px; cursor:pointer; display:flex; justify-content:space-between;
  border-bottom:1px solid var(--border); color:var(--text);
}
.branchrow:hover{background:var(--surface-2);}
.branchrow.active{background:var(--surface-2); color:var(--text); border-left:3px solid var(--accent); padding-left:11px; font-weight:600;}
.branchrow .cnt{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-dim); min-width:20px; text-align:right;}
.branchrow{align-items:center;}
.branchrow .bname{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-right:6px;}
.branchrow .rowbtns{display:flex; align-items:center; gap:6px; flex-shrink:0;}
.editbtn{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:13px; padding:3px; border-radius:3px;}
.editbtn:hover{color:var(--accent); background:var(--border);}
.delbtn{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:13px; padding:3px; border-radius:3px;}
.delbtn:hover{color:var(--danger); background:var(--border);}
.addbranch{
  padding:9px 14px; font-size:13px; color:var(--accent); cursor:pointer; border-top:1px solid var(--border);
}
.content{flex:1; overflow-y:auto; padding:22px 26px; max-width:900px;}
.content h2{font-size:clamp(18px, 3vw, 21px); margin:0 0 3px; font-weight:600; letter-spacing:-.1px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.content h2 .editbtn{font-size:15px;}
.content h2 .delbtn{font-size:15px;}
td .editbtn{font-size:12px; opacity:.75;}
td .editbtn:hover{opacity:1;}
.content .sub{font-size:13px; color:var(--text-dim); margin-bottom:18px;}
.addrow{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.addrow input{
  padding:9px 11px; background:var(--surface); border:1px solid var(--border); color:var(--text);
  border-radius:4px; font-family:inherit; font-size:13.5px;
}
.addrow input[name=iname]{flex:1; min-width:160px;}
.addrow input[name=iqty]{width:80px;}
.addrow button, .primary-btn{
  padding:9px 16px; background:var(--accent); color:#14181c; border:none; border-radius:4px;
  font-weight:600; cursor:pointer; font-size:13.5px;
}
table{width:100%; border-collapse:collapse;}
th{
  text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim);
  border-bottom:1px solid var(--border); padding:9px 6px; font-weight:600;
}
td{padding:11px 6px; border-bottom:1px solid var(--border); font-size:14.5px; color:var(--text);}
td.qty{font-family:'IBM Plex Mono',monospace; text-align:right; width:70px; font-weight:600;}
td.actions{width:80px; text-align:right;}
.qtybtn{
  width:24px; height:24px; border:1px solid var(--border); background:var(--surface-2); color:var(--text);
  border-radius:3px; cursor:pointer; font-size:14px; line-height:1; font-weight:600;
}
.qtybtn:hover{border-color:var(--accent); color:var(--accent);}
.del{color:var(--danger); cursor:pointer; font-size:12.5px; background:none; border:none; font-family:inherit; font-weight:500;}
.del:hover{text-decoration:underline;}
.empty{color:var(--text-dim); font-size:14px; padding:30px 0; text-align:center;}
.total{
  margin-top:16px; padding-top:12px; border-top:1px solid var(--border); font-size:13.5px; color:var(--text-dim);
}
.total b{color:var(--accent); font-family:'IBM Plex Mono',monospace; font-size:14.5px;}
.overview-row{
  display:flex; justify-content:space-between; padding:10px 6px; border-bottom:1px solid var(--border); font-size:14.5px;
}
.overview-row .n{font-family:'IBM Plex Mono',monospace; color:var(--accent);}
.sync{font-size:10.5px; color:var(--text-dim); margin-left:auto; align-self:center;}
::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

/* audit log */
.audittable td, .audittable th{font-size:12.5px;}
.audittable td.ts{font-family:'IBM Plex Mono',monospace; color:var(--text-dim); white-space:nowrap;}
.audittable td.user{font-family:'IBM Plex Mono',monospace; color:var(--accent); white-space:nowrap;}
.audittable td.action{white-space:nowrap;}

/* login overlay */
#loginOverlay{
  position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center;
  z-index:100; padding:20px;
}
.loginbox{
  width:100%; max-width:320px; background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:28px 24px;
}
.loginbox h2{margin:0 0 4px; font-size:18px; font-weight:600;}
.loginbox .sub{font-size:12.5px; color:var(--text-dim); margin-bottom:20px;}
.loginbox label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px; margin-top:14px;}
.loginbox input{
  width:100%; padding:10px 11px; background:var(--surface-2); border:1px solid var(--border);
  color:var(--text); border-radius:4px; font-family:inherit; font-size:14px;
}
.loginbox button{
  width:100%; margin-top:20px; padding:10px; background:var(--accent); color:#14181c; border:none;
  border-radius:4px; font-weight:600; cursor:pointer; font-size:14px;
}
.loginerr{color:var(--danger); font-size:12.5px; margin-top:10px; min-height:14px;}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:90;padding:16px;}
.modalbox{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:22px;}
.modalbox h3{margin:0 0 14px;font-size:17px;}
.modalbox .sub2{font-size:12.5px;color:var(--text-dim);font-weight:400;margin-left:6px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-bottom:10px;}
.modalbox label{display:block;font-size:12px;color:var(--text-dim);}
.modalbox input,.modalbox select,.modalbox textarea{width:100%;margin-top:4px;padding:9px 10px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:4px;font-family:inherit;font-size:14px;}
.mactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.ghostbtn{padding:6px 12px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:4px;cursor:pointer;font-size:12.5px;margin-left:8px;font-family:inherit;}
.ghostbtn:hover{border-color:var(--accent);color:var(--accent);}
.dangerbtn:hover{border-color:var(--danger);color:var(--danger);}
.itemmeta{font-size:12px;color:var(--text-dim);margin-top:2px;}
.pill{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--accent-dim);color:var(--accent);margin-left:6px;}
.archivedbanner{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--accent);padding:9px 12px;font-size:13px;margin-bottom:16px;border-radius:4px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.chip{padding:5px 11px;font-size:12.5px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:14px;cursor:pointer;font-family:inherit;}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:600;}
@media (max-width:640px){.grid2{grid-template-columns:1fr;}}

/* ===== mobile + PWA ===== */
html{-webkit-text-size-adjust:100%;}
button,.tab,.branchrow,.chip{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.hdr-actions{display:contents;}
.mobilenav{display:contents;}
.navtoggle{display:none;}
.railhead,.branchbar,#railBackdrop,#navBackdrop{display:none;}
@media (max-width:768px){
  body{min-height:100dvh;}
  header{padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));gap:8px 10px;align-items:center;position:relative;}
  .navtoggle{display:flex;order:0;align-items:center;justify-content:center;width:38px;height:38px;flex:0 0 auto;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:16px;cursor:pointer;}
  header h1{order:1;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header .stamp{display:none;}
  .userbadge{order:2;font-size:12px;gap:8px;}
  .userbadge b{max-width:105px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom;}
  .hide-sm{display:none;}
  /* tabs + actions collapse into a dropdown menu opened by the hamburger */
  .mobilenav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 10px 24px rgba(0,0,0,.3);z-index:75;flex-direction:column;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));max-height:calc(100dvh - 56px);overflow-y:auto;gap:10px;}
  .mobilenav.open{display:flex;}
  #navBackdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;}
  #navBackdrop.open{opacity:1;pointer-events:auto;}
  .tabs{width:100%;margin-left:0;gap:6px;flex-wrap:wrap;}
  .tab{flex:1 1 30%;text-align:center;padding:11px 4px;white-space:nowrap;font-size:13px;}
  .hdr-actions{display:flex;width:100%;gap:6px;flex-wrap:wrap;}
  .hdr-actions>*{flex:1 1 auto;}
  .hdr-actions .hide-sm{display:inline;}
  .exportbtn,.logoutbtn{min-height:42px;padding:8px 10px;font-size:13px;}
  .hdr-actions .exportbtn,.hdr-actions .logoutbtn{display:flex;align-items:center;justify-content:center;gap:6px;}
  .branchbar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:14.5px;cursor:pointer;}
  .branchbar .chg{color:var(--accent);font-size:13px;font-weight:600;}
  .branchbar.off{display:none;}
  /* branch list becomes a slide-in drawer */
  .rail{position:fixed;left:0;top:0;bottom:0;width:86%;max-width:330px;z-index:70;transform:translateX(-104%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  .rail.open{transform:none;box-shadow:6px 0 28px rgba(0,0,0,.5);}
  #railBackdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:65;opacity:0;pointer-events:none;transition:opacity .2s;}
  #railBackdrop.open{opacity:1;pointer-events:auto;}
  .railhead{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 4px;font-weight:600;font-size:16px;}
  .railhead button{background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;padding:4px 8px;}
  .rail input{font-size:16px;padding:12px;}
  .branchrow{padding:15px 14px;font-size:15.5px;}
  .branchrow.active{padding-left:11px;}
  .editbtn,.delbtn{padding:8px;font-size:17px;}
  .addbranch{padding:15px 14px;font-size:14.5px;}
  /* content */
  .content{padding:16px 14px calc(24px + env(safe-area-inset-bottom,0px));max-width:none;}
  .content h2{font-size:19px;flex-wrap:wrap;}
  .addrow input,.addrow button{font-size:16px;min-height:46px;}
  .addrow input[name=iname]{flex:1 1 100%;}
  .addrow input[name=iqty]{flex:0 0 96px;}
  .addrow button{flex:1;}
  .ghostbtn{min-height:40px;padding:8px 12px;}
  .overview-row{padding:13px 4px;}
  /* items table -> cards */
  .itemtable,.itemtable tbody{display:block;}
  .itemtable thead{display:none;}
  .itemtable tr{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"name name name" "qty act del";align-items:center;gap:8px 10px;padding:13px 2px;border-bottom:1px solid var(--border);}
  .itemtable td{border:none;padding:0;width:auto;}
  .itemtable td:nth-child(1){grid-area:name;font-size:15.5px;}
  .itemtable td.qty{grid-area:qty;text-align:left;font-size:21px;width:auto;}
  .itemtable td.actions:nth-child(3){grid-area:act;}
  .itemtable td.actions:nth-child(4){grid-area:del;}
  .qtybtn{width:42px;height:42px;font-size:22px;}
  .del{padding:12px 6px;font-size:14px;}
  /* wide tables scroll sideways */
  .audittable{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;}
  .chip{flex:0 0 auto;padding:9px 13px;}
  /* modal = bottom sheet */
  .modal{padding:0;align-items:flex-end;}
  .modalbox{max-width:none;border-radius:14px 14px 0 0;max-height:94dvh;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));}
  .modalbox input,.modalbox select,.modalbox textarea,.loginbox input{font-size:16px;}
  .modalbox input,.modalbox select{min-height:44px;}
  .loginbox button,.mactions button{min-height:46px;font-size:15px;}
}
/* extra-small phones (SE, small Android) */
@media (max-width:380px){
  header{padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));}
  header h1{font-size:14px;}
  header h1 i{display:none;}
  .tab{padding:9px 6px;font-size:12px;}
  .content{padding:12px 10px calc(20px + env(safe-area-inset-bottom,0px));}
  .content h2{font-size:17px;gap:6px;}
  .statgrid{grid-template-columns:repeat(2,1fr);}
  .addrow input[name=iqty]{flex:0 0 76px;}
  .loginbox{padding:22px 18px;}
  .modalbox{padding:16px;}
  .branchrow{font-size:14.5px;padding:13px 12px;}
}
/* landscape phones: reclaim vertical space */
@media (max-width:900px) and (max-height:420px) and (orientation:landscape){
  .tabs{order:2;}
  .hdr-actions{order:3;}
  header h1{order:1;}
  .rail{width:70%;}
}
/* ===== visual polish pass ===== */
*{transition:background-color .15s ease, border-color .15s ease, color .15s ease, transform .1s ease, box-shadow .15s ease;}
header{box-shadow:0 1px 0 rgba(0,0,0,.15);}
.tab{border-radius:6px;}
.tab:hover{color:var(--text);border-color:var(--accent-dim);}
.tab.active{box-shadow:0 1px 3px rgba(0,0,0,.25);}
.rail{box-shadow:1px 0 0 rgba(0,0,0,.08);}
.branchrow:hover{transform:translateX(2px);}
.branchrow.active{box-shadow:inset 3px 0 0 0 var(--accent);}
.branchbar{box-shadow:0 1px 3px rgba(0,0,0,.15);}
.exportbtn,.primary-btn,.addrow button{border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.2);}
.exportbtn:hover,.primary-btn:hover,.addrow button:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.25);}
.exportbtn:active,.primary-btn:active,.addrow button:active{transform:translateY(0);box-shadow:0 1px 2px rgba(0,0,0,.2);}
.ghostbtn{border-radius:6px;}
.ghostbtn:hover{transform:translateY(-1px);}
.logoutbtn{border-radius:6px;}
table{border-radius:6px;overflow:hidden;}
tbody tr{transition:background-color .12s ease;}
tbody tr:hover{background:var(--surface-2);}
.qtybtn{border-radius:5px;}
.qtybtn:hover{transform:scale(1.08);}
.del:hover{color:#ff8a7a;}
.content h2{letter-spacing:-.2px;}
.pill{background:rgba(212,162,76,.16);border:1px solid var(--accent-dim);}
.pill-out{background:rgba(212,162,76,.22);color:var(--accent);border-color:var(--accent-dim);}
.pill-stock{background:rgba(90,155,216,.2);color:#7fb4e8;border-color:#3d6f9c;}
.pill-repair{background:rgba(224,138,60,.2);color:#f0a45c;border-color:#a5641f;}
.pill-retired{background:rgba(139,146,156,.22);color:#aeb4bc;border-color:#5c6169;}
.pill-lost{background:rgba(224,106,92,.2);color:var(--danger);border-color:#8c3a30;}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.statcard{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:16px 14px;text-align:center;}
.statcard-accent{border-color:var(--accent-dim);}
.statn{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;color:var(--text);}
.statcard-accent .statn{color:var(--accent);}
.statl{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-top:4px;}
@media (max-width:640px){.statgrid{gap:8px;}.statcard{padding:12px 8px;}.statn{font-size:20px;}}
.overview-row{border-radius:5px;padding-left:8px;padding-right:8px;}
.overview-row:hover{background:var(--surface-2);}

/* ---------- auth (Supabase Auth) ---------- */
const EMAIL_DOMAIN = '@ict.local';
let currentUser = null;
let currentRole = 'staff';
function isAdmin(){ return currentRole === 'admin'; }

function showLogin(){
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('loginPass').value = '';
  setTimeout(()=>document.getElementById('loginUser').focus(), 0);
}
function hideLogin(){ document.getElementById('loginOverlay').style.display = 'none'; }

function applySession(user){
  currentUser = user.email;
  currentRole = (user.app_metadata && user.app_metadata.role) || 'staff';
  document.getElementById('userLabel').textContent = currentUser + (isAdmin() ? ' (admin)' : '');

async function attemptLogin(){
  const err = document.getElementById('loginErr');
  let u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  if(!u || !p){ err.textContent = 'Enter your username/email and password.'; return; }
  if(!u.includes('@')) u = u.toLowerCase() + EMAIL_DOMAIN;
  err.textContent = 'Signing in…';
  const { data, error } = await sb.auth.signInWithPassword({ email:u, password:p });
  if(error){
    err.textContent = error.message === 'Invalid login credentials' ? 'Incorrect username/email or password.' : error.message;
    return;
  }
  err.textContent = '';
  applySession(data.user);
  hideLogin();
  await logAudit('login', `${currentUser} signed in`);
  boot();
}
document.getElementById('loginBtn').onclick = attemptLogin;
document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') attemptLogin(); });
document.getElementById('loginUser').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('loginPass').focus(); });
document.getElementById('logoutBtn').onclick = async ()=>{

/* ---------- state ---------- */
let state = { branches: [] };
let auditCache = [];
let selected = null;
let view = 'branch';
let showArchived = false;
let auditUser = '';

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTs(iso){ try{ return new Date(iso).toLocaleString(); }catch(e){ return iso; } }

/* ---------- data layer (Supabase) ---------- */
function showBanner(msg){
  let el = document.getElementById('connBanner');
  if(!el){
    el = document.createElement('div');
    el.id = 'connBanner';
    el.style.cssText = 'background:var(--danger);color:#fff;font-size:12.5px;padding:8px 20px;';
    document.body.insertBefore(el, document.querySelector('header').nextSibling);
  }
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

async function logAudit(action, details){
  try{ const { error } = await sb.from('audit_log').insert({ app_user: currentUser || 'unknown', action, details }); if(error) throw error; }
  catch(e){ console.error('audit log write failed', e); showBanner('Could not write to database: '+(e.message||JSON.stringify(e))); }
}

async function refreshAudit(){
  const { data, error } = await sb.from('audit_log').select('*').order('ts', { ascending:false }).limit(500);
  if(error){ console.error('audit fetch failed', error); showBanner('Could not load audit log: '+(error.message||JSON.stringify(error))); return; }
  showBanner(null);
  auditCache = data || [];
  if(view==='audit') render();
}

// Supabase returns at most 1000 rows per request, so read big tables in pages.
async function fetchAll(table){
  let all = [], from = 0; const size = 1000;
  while(true){
    const { data, error } = await sb.from(table).select('*').order('name').order('id').range(from, from+size-1);
    if(error) return { data:null, error };
    all = all.concat(data || []);
    if(!data || data.length < size) break;
    from += size;
  }
  return { data:all, error:null };
}

function nestData(branches, items){
  const byBranch = {};
  (items||[]).forEach(it=>{
    (byBranch[it.branch_id] = byBranch[it.branch_id] || []).push({
      id:it.id, name:it.name, qty:it.qty, serial_no:it.serial_no||'', asset_tag:it.asset_tag||'',
      status:it.status||'In use', assigned_to:it.assigned_to||'', purchase_date:it.purchase_date||'',
      notes:it.notes||'', updated_at:it.updated_at
    });
  });
  return (branches||[]).map(b=>({ id:b.id, name:b.name, archived:!!b.archived, items:byBranch[b.id]||[] }));
}

async function loadAllData(){
  const [{ data: branches, error: be }, { data: items, error: ie }] = await Promise.all([ fetchAll('branches'), fetchAll('items') ]);
  if(be || ie){
    const err = be||ie;
    console.error('load failed', err);
    showBanner('Could not connect to database: '+(err.message||JSON.stringify(err)));
    return;
  }
  showBanner(null);
  state.branches = nestData(branches, items);
  const visible = state.branches.filter(b=>!!b.archived===showArchived);
  if(!selected || !visible.find(b=>b.id===selected)) selected = (visible[0] && visible[0].id) || null;
  const badge = document.getElementById('branchCountBadge');
  const active = state.branches.filter(b=>!b.archived).length;
  if(badge) badge.textContent = active + (active===1 ? ' BRANCH' : ' BRANCHES');
  render();
}

/* ---------- mutations ---------- */
const STATUSES = ['In use','In stock','Checked out','For repair','Retired','Lost'];
const ITEM_FIELDS = [['name','Name'],['qty','Qty'],['serial_no','Serial no.'],['asset_tag','Asset tag'],['status','Status'],['assigned_to','Assigned to'],['purchase_date','Purchase date'],['notes','Notes']];

async function renameBranch(b){
  const name = prompt('Rename branch:', b.name);
  if(!name || !name.trim() || name.trim()===b.name) return;
  const oldName = b.name;
  const { error } = await sb.from('branches').update({ name:name.trim() }).eq('id', b.id);
  if(error){ alert('Rename failed: '+error.message); return; }
  await logAudit('rename_branch', `Renamed branch "${oldName}" to "${name.trim()}"`);
  refreshAudit(); loadAllData();
}

async function archiveBranch(b){
  if(!isAdmin()) return;
  if(!confirm(`Archive "${b.name}"? It is hidden from the list but all its items are kept. You can restore it anytime.`)) return;
  const { error } = await sb.from('branches').update({ archived:true }).eq('id', b.id);
  if(error){ alert('Archive failed: '+error.message); return; }
  await logAudit('archive_branch', `Archived branch "${b.name}" (${b.items.length} item rows kept)`);
  selected = null;
  refreshAudit(); loadAllData();
}

async function restoreBranch(b){
  if(!isAdmin()) return;
  const { error } = await sb.from('branches').update({ archived:false }).eq('id', b.id);
  if(error){ alert('Restore failed: '+error.message); return; }
  await logAudit('restore_branch', `Restored branch "${b.name}"`);
  showArchived = false; selected = b.id; view = 'branch'; setTabs();
  refreshAudit(); loadAllData();
}

async function deleteBranch(b){
  if(!isAdmin() || !b.archived) return;
  if(!confirm(`PERMANENTLY delete "${b.name}" and its ${b.items.length} item rows? This cannot be undone. Tip: use Export Excel first.`)) return;
  if(!(await takeSnapshot('pre-delete', false))) return;
  const { error } = await sb.from('branches').delete().eq('id', b.id);
  if(error){ alert('Delete failed: '+error.message); return; }
  await logAudit('delete_branch', `Permanently deleted archived branch "${b.name}" (${b.items.length} item rows)`);
  selected = null;
  refreshAudit(); loadAllData();
}

async function addBranchPrompt(){
  const name = prompt('New branch name:');
  if(!name) return;
  const { data, error } = await sb.from('branches').insert({ name:name.trim() }).select().single();
  if(error){ alert('Add branch failed: '+error.message); return; }
  showArchived = false; selected = data.id; view = 'branch'; setTabs();
  await logAudit('add_branch', `Added branch "${data.name}"`);
  refreshAudit(); loadAllData();
}

async function addItem(b, name, qty){
  const existing = b.items.find(x=>x.name.toLowerCase()===name.toLowerCase() && !x.serial_no && !x.asset_tag);
  if(existing){
    const newQty = Number(existing.qty)+qty;
    const { error } = await sb.from('items').update({ qty:newQty, updated_at:new Date().toISOString() }).eq('id', existing.id);
    if(error){ alert('Update failed: '+error.message); return; }
    await logAudit('add_item', `Added ${qty} to existing "${existing.name}" in ${b.name} → now ${newQty}`);
  } else {
    const { error } = await sb.from('items').insert({ branch_id:b.id, name, qty });
    if(error){ alert('Add item failed: '+error.message); return; }
    await logAudit('add_item', `Added new item "${name}" (qty ${qty}) to ${b.name}`);
  }
  refreshAudit(); loadAllData();
}

function closeModal(){ const ov = document.getElementById('modalOverlay'); ov.style.display = 'none'; ov.innerHTML = ''; }

function openItemModal(b, it){
  const isNew = !it;
  const v = it || { name:'', qty:1, serial_no:'', asset_tag:'', status:'In use', assigned_to:'', purchase_date:'', notes:'' };
  const opts = STATUSES.includes(v.status) ? STATUSES : [v.status].concat(STATUSES);
  const ov = document.getElementById('modalOverlay');
  ov.innerHTML = `<div class="modalbox">
    <h3>${isNew ? 'Add item with details' : 'Edit item'}<span class="sub2">${escapeHtml(b.name)}</span></h3>
    <div class="grid2">
      <label>Item name<input id="m_name" value="${escapeHtml(v.name)}"></label>
      <label>Qty<input id="m_qty" type="number" min="0" value="${escapeHtml(v.qty)}"></label>
      <label>Serial no.<input id="m_serial" value="${escapeHtml(v.serial_no)}"></label>
      <label>Asset tag<input id="m_tag" value="${escapeHtml(v.asset_tag)}"></label>
      <label>Status<select id="m_status">${opts.map(o=>`<option${o===v.status?' selected':''}>${escapeHtml(o)}</option>`).join('')}</select></label>
      <label>Assigned to<input id="m_assigned" value="${escapeHtml(v.assigned_to)}"></label>
      <label>Purchase date<input id="m_date" type="date" value="${escapeHtml(v.purchase_date)}"></label>
    </div>
    <label>Notes<textarea id="m_notes" rows="2">${escapeHtml(v.notes)}</textarea></label>
    <div class="loginerr" id="m_err"></div>
    <div class="mactions"><button class="ghostbtn" id="m_cancel">Cancel</button><button class="primary-btn" id="m_save"><i class="fa-solid fa-check"></i> Save</button></div>
  </div>`;
  ov.style.display = 'flex';
  ov.onclick = e=>{ if(e.target===ov) closeModal(); };
  document.getElementById('m_cancel').onclick = closeModal;
  document.getElementById('m_save').onclick = async ()=>{
    const g = id=>document.getElementById(id).value.trim();
    const err = document.getElementById('m_err');
    const name = g('m_name'), qty = Number(g('m_qty')||0);
    if(!name){ err.textContent = 'Item name is required.'; return; }
    if(isNaN(qty) || qty<0){ err.textContent = 'Qty must be 0 or more.'; return; }
    const nv = { name, qty, serial_no:g('m_serial'), asset_tag:g('m_tag'), status:g('m_status')||'In use', assigned_to:g('m_assigned'), purchase_date:g('m_date'), notes:g('m_notes') };
    const row = { name, qty, serial_no:nv.serial_no||null, asset_tag:nv.asset_tag||null, status:nv.status, assigned_to:nv.assigned_to||null, purchase_date:nv.purchase_date||null, notes:nv.notes||null, updated_at:new Date().toISOString() };
    let res, msg;
    if(isNew){
      res = await sb.from('items').insert(Object.assign({ branch_id:b.id }, row));
      msg = `Added "${name}" (qty ${qty}${nv.asset_tag?', tag '+nv.asset_tag:''}${nv.serial_no?', S/N '+nv.serial_no:''}) to ${b.name}`;
    } else {
      const diffs = ITEM_FIELDS.filter(([k])=>String(it[k]==null?'':it[k])!==String(nv[k]==null?'':nv[k])).map(([k,l])=>`${l}: ${it[k]||'—'} → ${nv[k]||'—'}`);
      if(!diffs.length){ closeModal(); return; }
      res = await sb.from('items').update(row).eq('id', it.id);
      msg = `Edited "${it.name}" in ${b.name} — ${diffs.join('; ')}`;
    }
    if(res.error){ err.textContent = 'Save failed: '+res.error.message; return; }
    closeModal();
    await logAudit(isNew?'add_item':'edit_item', msg);
    refreshAudit(); loadAllData();
  };
}

async function bumpItem(b, it, delta){
  const newQty = Math.max(0, Number(it.qty)+delta);
  const { error } = await sb.from('items').update({ qty:newQty, updated_at:new Date().toISOString() }).eq('id', it.id);
  if(error){ alert('Update failed: '+error.message); return; }
  await logAudit(delta>0?'increment':'decrement', `${delta>0?'+1':'-1'} "${it.name}" in ${b.name} → now ${newQty}`);
  refreshAudit(); loadAllData();
}

async function deleteItem(b, it){
  const { error } = await sb.from('items').delete().eq('id', it.id);
  if(error){ alert('Delete failed: '+error.message); return; }
  await logAudit('delete_item', `Removed "${it.name}" (qty ${it.qty}${it.asset_tag?', tag '+it.asset_tag:''}) from ${b.name}`);
  refreshAudit(); loadAllData();
}

/* ---------- QR labels: print + scan ---------- */
const qrCode = it => `ICTITEM:${it.id}`;

async function printLabels(b){
  if(typeof QRCode === 'undefined'){ alert('QR code library did not load — check your connection and try again.'); return; }
  const box = document.getElementById('printLabels');
  box.innerHTML = '<div class="label" style="border:none">Generating…</div>';
  const cells = await Promise.all(b.items.map(async it=>{
    const dataUrl = await QRCode.toDataURL(qrCode(it), { width:220, margin:1 });
    const sub = [it.asset_tag && `Tag ${it.asset_tag}`, it.serial_no && `S/N ${it.serial_no}`].filter(Boolean).join(' · ');
    return `<div class="label"><img src="${dataUrl}" alt=""><div class="lname">${escapeHtml(it.name)}</div><div class="lbranch">${escapeHtml(b.name)}</div>${sub?`<div class="ltag">${escapeHtml(sub)}</div>`:''}</div>`;
  }));
  box.innerHTML = cells.join('');
  requestAnimationFrame(()=>window.print());
}

let scanner = null;
function openScanModal(){
  const ov = document.getElementById('modalOverlay');
  ov.innerHTML = `<div class="modalbox">
    <h3>Scan an item's label</h3>
    <div id="qr-reader" style="width:100%;border-radius:6px;overflow:hidden"></div>
    <div class="loginerr" id="scan_err"></div>
    <div class="mactions"><button class="ghostbtn" id="scan_cancel">Cancel</button></div>
  </div>`;
  ov.style.display = 'flex';
  ov.onclick = e=>{ if(e.target===ov) closeScanModal(); };
  document.getElementById('scan_cancel').onclick = closeScanModal;
  if(typeof Html5Qrcode === 'undefined'){ document.getElementById('scan_err').textContent = 'Scanner library did not load — check your connection and try again.'; return; }
  scanner = new Html5Qrcode('qr-reader');
  scanner.start({ facingMode:'environment' }, { fps:10, qrbox:220 }, onScanSuccess, ()=>{})
    .catch(err=>{ document.getElementById('scan_err').textContent = 'Could not open the camera: '+(err.message||err); });
}
function closeScanModal(){
  if(scanner){ scanner.stop().then(()=>scanner.clear()).catch(()=>{}); scanner = null; }
  closeModal();
}
function onScanSuccess(text){
  closeScanModal();
  const m = /^ICTITEM:(\d+)$/.exec(text.trim());
  if(m){
    const id = Number(m[1]);
    for(const b of state.branches){
      const it = b.items.find(x=>x.id===id);
      if(it){
        selected=b.id; showArchived=!!b.archived; view='branch'; setTabs(); render();
        if(b.archived) alert(`Found "${it.name}" in ${b.name} — this branch is archived (read-only).`);
        else openItemModal(b, it);
        return;
      }
    }
    alert("That label's item wasn't found — it may have been deleted.");
    return;
  }
  // unrecognized code: treat as a new asset in the current branch, prefill serial
  const b = state.branches.find(x=>x.id===selected) || state.branches.find(x=>!x.archived);
  if(!b){ alert('Add a branch first.'); return; }
  selected = b.id; view='branch'; setTabs(); render();
  openItemModal(b, null);
  const s = document.getElementById('m_serial'); if(s) s.value = text.trim();
}

/* ---------- render ---------- */
function render(){
  renderBranchList();
  if(view==='all') renderOverview();
  else if(view==='audit') renderAudit();
  else if(view==='backups') renderBackups();
  else if(view==='onloan') renderOnLoan();
  else renderBranch();
}

function renderBranchList(){
  const q = (document.getElementById('branchSearch').value||'').toLowerCase();
  const list = document.getElementById('branchList');
  list.innerHTML = '';
  state.branches.filter(b=>!!b.archived===showArchived && b.name.toLowerCase().includes(q)).forEach(b=>{
    const total = b.items.reduce((s,it)=>s+Number(it.qty||0),0);
    const row = document.createElement('div');
    row.className = 'branchrow' + (b.id===selected?' active':'');
    const adminBtn = !isAdmin() ? '' : (b.archived
      ? '<button class="editbtn" data-a="restore" title="Restore branch"><i class="fa-solid fa-rotate-left"></i></button>'
      : '<button class="editbtn" data-a="archive" title="Archive branch"><i class="fa-solid fa-box-archive"></i></button>');
    row.innerHTML = `<span class="bname">${escapeHtml(b.name)}</span><span class="rowbtns"><button class="editbtn" data-a="edit" title="Rename"><i class="fa-solid fa-pen"></i></button>${adminBtn}<span class="cnt">${total}</span></span>`;
    row.onclick = ()=>{ selected=b.id; view='branch'; setTabs(); closeRail(); render(); };
    row.querySelector('[data-a=edit]').onclick = (e)=>{ e.stopPropagation(); renameBranch(b); };
    const ab = row.querySelector('[data-a=archive]'); if(ab) ab.onclick = (e)=>{ e.stopPropagation(); archiveBranch(b); };
    const rb = row.querySelector('[data-a=restore]'); if(rb) rb.onclick = (e)=>{ e.stopPropagation(); restoreBranch(b); };
    list.appendChild(row);
  });
  const arch = state.branches.filter(b=>b.archived).length;
  document.getElementById('toggleArchived').innerHTML = showArchived ? '<i class="fa-solid fa-arrow-left"></i> Back to active branches' : (arch ? `<i class="fa-solid fa-box-archive"></i> Show archived (${arch})` : 'No archived branches');
  const cur = state.branches.find(x=>x.id===selected), bn = document.getElementById('branchBarName');
  if(bn) bn.textContent = cur ? cur.name + (cur.archived ? ' (archived)' : '') : 'Select branch';
}

function setTabs(){
  document.getElementById('tabBranch').classList.toggle('active', view==='branch');
  document.getElementById('tabAll').classList.toggle('active', view==='all');
  document.getElementById('tabAudit').classList.toggle('active', view==='audit');
  document.getElementById('tabBackups').classList.toggle('active', view==='backups');
  document.getElementById('tabOnLoan').classList.toggle('active', view==='onloan');
  document.getElementById('branchBar').classList.toggle('off', view!=='branch');
}

      <input name="iname" placeholder="Item name (e.g. Laptop)">
      <input name="iqty" type="number" min="1" value="1" placeholder="Qty">
      <button id="addItemBtn"><i class="fa-solid fa-plus"></i> Add item</button>

    <table class="itemtable">

      <tbody id="itemsBody"></tbody>
    </table>

function statusPillClass(status){
  const s = (status||'').toLowerCase();
  if(s==='checked out') return 'pill pill-out';
  if(s==='in stock') return 'pill pill-stock';
  if(s==='for repair') return 'pill pill-repair';
  if(s==='retired') return 'pill pill-retired';
  if(s==='lost') return 'pill pill-lost';
  return 'pill';
}

function renderAudit(){
  const content = document.getElementById('content');
  const stats = {};
  auditCache.forEach(e=>{
    const u = e.app_user || 'unknown';
    if(!stats[u]) stats[u] = { n:0, last:e.ts };
    stats[u].n++; if(e.ts > stats[u].last) stats[u].last = e.ts;
  });
  const users = Object.keys(stats).sort();
  if(auditUser && !stats[auditUser]) auditUser = '';
  const rows = auditUser ? auditCache.filter(e=>e.app_user===auditUser) : auditCache;
  content.innerHTML = `
    <h2>Audit Log</h2>
    <div class="sub">Live activity from all users, most recent first (last 500 kept). Click a user to filter.</div>
    <div class="chips">
      <button class="chip${auditUser?'':' on'}" data-u="">All users (${users.length})</button>
      ${users.map(u=>`<button class="chip${auditUser===u?' on':''}" data-u="${escapeHtml(u)}" title="Last active ${escapeHtml(fmtTs(stats[u].last))}">${escapeHtml(u)} · ${stats[u].n}</button>`).join('')}
    </div>
    ${rows.length===0 ? '<div class="empty">No activity logged yet.</div>' : `
    <table class="audittable">
      <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead>
      <tbody>
        ${rows.map(e=>`<tr><td class="ts">${escapeHtml(fmtTs(e.ts))}</td><td class="user">${escapeHtml(e.app_user)}</td><td class="action">${escapeHtml(e.action)}</td><td>${escapeHtml(e.details)}</td></tr>`).join('')}
      </tbody>
    </table>`}
  `;
  content.querySelectorAll('.chip').forEach(c=>{ c.onclick = ()=>{ auditUser = c.dataset.u; renderAudit(); }; });
}

/* ---------- Check-out / Check-in (serialized assets) ---------- */
function overdue(due){ return due && due < new Date().toISOString().slice(0,10); }

function itemLabel(it){ return it.name + (it.asset_tag?' — Tag '+it.asset_tag:(it.serial_no?' — S/N '+it.serial_no:'')); }

async function submitCheckout(b, it, to, due, note, qtyRaw, err){
  if(!to){ if(err) err.textContent = 'Enter who this is being checked out to.'; return false; }
  const qty = Math.max(1, Number(qtyRaw)||1);
  if(qty > Number(it.qty)){ if(err) err.textContent = `Only ${it.qty} on hand.`; return false; }
  const newQty = Number(it.qty) - qty;
  const patch = { qty:newQty, updated_at:new Date().toISOString() };
  if(newQty === 0){ patch.status = 'Checked out'; patch.assigned_to = to; } // fully out: show it on the row
  const { error: ue } = await sb.from('items').update(patch).eq('id', it.id);
  if(ue){ if(err) err.textContent = 'Save failed: '+ue.message; return false; }
  const { error: ce } = await sb.from('checkouts').insert({ item_id:it.id, branch_id:b.id, branch_name:b.name, item_name:it.name, serial_no:it.serial_no||null, asset_tag:it.asset_tag||null, checked_out_to:to, checked_out_by:currentUser, due_date:due, note, qty });
  if(ce && err) err.textContent = 'Saved item, but the loan record failed: '+ce.message;
  closeModal();
  const label = (qty>1?qty+' x ':'') + it.name;
  await logAudit('checkout', `Checked out ${label}${it.asset_tag?' (tag '+it.asset_tag+')':(it.serial_no?' (S/N '+it.serial_no+')':'')} from ${b.name} to ${to}${due?', due '+due:''}`);
  refreshAudit(); loadAllData(); if(view==='onloan') refreshLoans();
  return true;
}

function checkoutFormHtml(b, qtyMax){
  return `<label>Qty to check out <span class="sub2">(of ${qtyMax} on hand)</span><input id="co_qty" type="number" min="1" max="${qtyMax}" value="1"></label>
    <label style="margin-top:10px">Checked out to<input id="co_to" placeholder="Name of person"></label>
    <div class="grid2" style="margin-top:10px">
      <label>Due back (optional)<input id="co_due" type="date"></label>
      <label>Branch<input value="${escapeHtml(b.name)}" disabled></label>
    </div>
    <label>Note (optional)<textarea id="co_note" rows="2" placeholder="Purpose, condition, etc."></textarea></label>
    <div class="loginerr" id="co_err"></div>
    <div class="mactions"><button class="ghostbtn" id="co_cancel">Cancel</button><button class="primary-btn" id="co_save"><i class="fa-solid fa-right-from-bracket"></i> Check out</button></div>`;
}

function openCheckoutModal(b, it){
  const ov = document.getElementById('modalOverlay');
  ov.innerHTML = `<div class="modalbox"><h3>Check out<span class="sub2">${escapeHtml(itemLabel(it))}</span></h3>${checkoutFormHtml(b, it.qty)}</div>`;
  ov.style.display = 'flex';
  ov.onclick = e=>{ if(e.target===ov) closeModal(); };
  document.getElementById('co_cancel').onclick = closeModal;
  document.getElementById('co_save').onclick = ()=>{
    const err = document.getElementById('co_err');
    submitCheckout(b, it, document.getElementById('co_to').value.trim(), document.getElementById('co_due').value || null, document.getElementById('co_note').value.trim() || null, document.getElementById('co_qty').value, err);
  };
}

function openCheckoutPicker(b){
  const eligible = b.items.filter(it => Number(it.qty) > 0);
  if(!eligible.length){ alert('Nothing in this branch is currently available to check out.'); return; }
  const ov = document.getElementById('modalOverlay');
  const optHtml = eligible.map(it=>`<option value="${it.id}" data-max="${it.qty}">${escapeHtml(itemLabel(it))} (${it.qty} on hand)</option>`).join('');
  ov.innerHTML = `<div class="modalbox">
    <h3>Check out<span class="sub2">${escapeHtml(b.name)}</span></h3>
    <label>Which item<select id="co_item">${optHtml}</select></label>
    <div id="co_form" style="margin-top:10px"></div>
  </div>`;
  ov.style.display = 'flex';
  ov.onclick = e=>{ if(e.target===ov) closeModal(); };
  const sel = document.getElementById('co_item');
  const wire = ()=>{
    const it = eligible.find(x=>x.id===sel.value);
    document.getElementById('co_form').innerHTML = checkoutFormHtml(b, it.qty);
    document.getElementById('co_cancel').onclick = closeModal;
    document.getElementById('co_save').onclick = ()=>{
      const err = document.getElementById('co_err');
      submitCheckout(b, it, document.getElementById('co_to').value.trim(), document.getElementById('co_due').value || null, document.getElementById('co_note').value.trim() || null, document.getElementById('co_qty').value, err);
    };
  };
  sel.onchange = wire; wire();
}

async function checkInItem(b, it){
  const { data: rows, error: fe } = await sb.from('checkouts').select('*').eq('item_id', it.id).is('returned_at', null).order('checked_out_at', { ascending:false }).limit(1);
  if(fe){ alert('Could not look up the loan record: '+fe.message); return; }
  if(!rows || !rows[0]){ alert('No open loan record found for this item.'); return; }
  checkInRecordById(rows[0]);
}

async function checkInRecordById(r){
  const label = (r.qty>1?r.qty+' x ':'') + r.item_name;
  if(!confirm(`Check in ${label} from ${r.checked_out_to}?`)) return;
  const { data: itRows } = await sb.from('items').select('id,qty,status').eq('id', r.item_id).limit(1);
  if(itRows && itRows[0]){
    const newQty = Number(itRows[0].qty) + Number(r.qty||1);
    const patch = { qty:newQty, updated_at:new Date().toISOString() };
    if(itRows[0].status === 'Checked out'){ patch.status = 'In use'; patch.assigned_to = null; } // was fully out, now something's back
    await sb.from('items').update(patch).eq('id', r.item_id);
  }
  await sb.from('checkouts').update({ returned_at:new Date().toISOString(), returned_by:currentUser }).eq('id', r.id);
  await logAudit('checkin', `Checked in ${label} to ${r.branch_name} (was out to ${r.checked_out_to})`);
  refreshAudit(); loadAllData(); refreshLoans();
}

async function refreshLoans(){
  let q = sb.from('checkouts').select('*').order('checked_out_at', { ascending:false }).limit(500);
  if(!showReturned) q = q.is('returned_at', null);
  const { data, error } = await q;
  if(error){
    loanList = [];
    document.getElementById('content').innerHTML = `<h2>On Loan</h2><div class="archivedbanner">Could not load loan records: ${escapeHtml(error.message)}. Make sure the checkouts SQL script has been run.</div>`;
    return;
  }
  loanList = data || [];
  if(view==='onloan') renderOnLoan();
}

document.getElementById('tabOnLoan').onclick = ()=>{ view='onloan'; setTabs(); renderBranchList(); refreshLoans(); };

/* ---------- Excel export / import ---------- */
function makeSheet(rows, header, widths){
  const ws = XLSX.utils.json_to_sheet(rows, { header });
  ws['!cols'] = widths.map(w=>({ wch:w }));
  return ws;
}
const INV_HEADER = ['Branch','Item','Qty','Serial No','Asset Tag','Status','Assigned To','Purchase Date','Notes','Last Updated','Archived'];
const INV_WIDTHS = [22,30,8,20,16,12,22,14,30,22,10];

function addInventorySheets(wb, branches){
  const inventory = [], totals = {};
  const byBranch = branches.map(b=>{
    let units = 0;
    b.items.forEach(it=>{
      const q = Number(it.qty||0);
      units += q;
      if(!b.archived) totals[it.name] = (totals[it.name]||0) + q;
      inventory.push({ Branch:b.name, Item:it.name, Qty:q, 'Serial No':it.serial_no, 'Asset Tag':it.asset_tag, Status:it.status, 'Assigned To':it.assigned_to, 'Purchase Date':it.purchase_date, Notes:it.notes, 'Last Updated': it.updated_at ? fmtTs(it.updated_at) : '', Archived: b.archived ? 'Yes' : 'No' });
    });
    return { Branch:b.name, 'Item Types':b.items.length, 'Total Units':units, Archived: b.archived ? 'Yes' : 'No' };
  });
  const companyTotals = Object.keys(totals).sort().map(n=>({ Item:n, 'Total Units':totals[n] }));
  XLSX.utils.book_append_sheet(wb, makeSheet(inventory, INV_HEADER, INV_WIDTHS), 'Inventory');
  XLSX.utils.book_append_sheet(wb, makeSheet(byBranch, ['Branch','Item Types','Total Units','Archived'], [24,12,12,10]), 'By Branch');
  XLSX.utils.book_append_sheet(wb, makeSheet(companyTotals, ['Item','Total Units'], [32,12]), 'Company Totals');
  return inventory.length;
}

async function exportExcel(){
  if(typeof XLSX === 'undefined'){ alert('Excel library did not load. Open the file in a normal browser tab.'); return; }
  const btn = document.getElementById('exportBtn');
  btn.disabled = true; btn.textContent = 'Exporting…';
  try{
    await loadAllData();
    const stamp = new Date().toISOString().slice(0,10);
    const wb = XLSX.utils.book_new();
    const n = addInventorySheets(wb, state.branches);
    const { data } = await sb.from('audit_log').select('*').order('ts', { ascending:false }).limit(1000);
    const audit = (data||[]).map(e=>({ Time:fmtTs(e.ts), User:e.app_user, Action:e.action, Details:e.details }));
    XLSX.utils.book_append_sheet(wb, makeSheet(audit, ['Time','User','Action','Details'], [22,28,16,70]), 'Audit Log (last 1000)');
    XLSX.writeFile(wb, `ICT-Inventory-Backup-${stamp}.xlsx`);
    await logAudit('export', `Exported inventory to Excel (${n} item rows)`);
    refreshAudit();
  }catch(e){
    console.error(e); alert('Export failed: ' + (e.message || e));
  }finally{
    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-file-arrow-down"></i> Export Excel';
  }
}

function downloadTemplate(){
  if(typeof XLSX === 'undefined'){ alert('Excel library did not load.'); return; }
  const rows = [
    { Branch:'S01', Item:'Laptop', Qty:1, 'Serial No':'SN12345', 'Asset Tag':'GCG-0001', Status:'In use', 'Assigned To':'Juan Dela Cruz', 'Purchase Date':'2025-03-01', Notes:'Example asset row' },
    { Branch:'S01', Item:'Desktop', Qty:10, 'Serial No':'', 'Asset Tag':'', Status:'', 'Assigned To':'', 'Purchase Date':'', Notes:'Example bulk row (no serial/tag)' }
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, makeSheet(rows, INV_HEADER.slice(0,9), INV_WIDTHS), 'Inventory');
  XLSX.writeFile(wb, 'ICT-Inventory-Import-Template.xlsx');
}

const IMPORT_MAP = { branch:'branch', item:'item', qty:'qty', serialno:'serial_no', assettag:'asset_tag', status:'status', assignedto:'assigned_to', purchasedate:'purchase_date', notes:'notes' };
function normDate(v){
  v = String(v||'').trim(); if(!v) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const d = new Date(v); if(isNaN(d)) return null;
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function findExisting(b, r){
  if(!b) return null;
  const eq = (a, c)=>a && a.toLowerCase()===c.toLowerCase();
  if(r.asset_tag) return b.items.find(i=>eq(i.asset_tag, r.asset_tag));
  if(r.serial_no) return b.items.find(i=>eq(i.serial_no, r.serial_no));
  return b.items.find(i=>!i.serial_no && !i.asset_tag && eq(i.name, r.name));
}

async function importExcel(file){
  if(!isAdmin() || !file) return;
  if(typeof XLSX === 'undefined'){ alert('Excel library did not load. Open the file in a normal browser tab.'); return; }
  const btn = document.getElementById('importBtn');
  btn.disabled = true; btn.textContent = 'Importing…';
  try{
    const wb = XLSX.read(await file.arrayBuffer(), { type:'array' });
    const ws = wb.Sheets['Inventory'] || wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false });
    const rows = []; let skipped = 0;
    raw.forEach(r=>{
      const o = {};
      Object.keys(r).forEach(k=>{ const m = IMPORT_MAP[k.toLowerCase().replace(/[^a-z]/g,'')]; if(m) o[m] = String(r[k]).trim(); });
      const qty = (o.qty===undefined || o.qty==='') ? 1 : Number(o.qty);
      if(!o.branch || !o.item || isNaN(qty) || qty<0){ skipped++; return; }
      rows.push({ branch:o.branch, name:o.item, qty, serial_no:o.serial_no||null, asset_tag:o.asset_tag||null, status:o.status||null, assigned_to:o.assigned_to||null, purchase_date:normDate(o.purchase_date), notes:o.notes||null });
    });
    if(!rows.length){ alert('No valid rows found. The sheet needs the columns Branch, Item and Qty. Use the Template button for an example.'); return; }

    const byName = {};
    state.branches.forEach(b=>{ byName[b.name.toLowerCase()] = b; });
    const newBranches = {};
    rows.forEach(r=>{ if(!byName[r.branch.toLowerCase()]) newBranches[r.branch.toLowerCase()] = r.branch; });
    const inserts = [], updates = [];
    rows.forEach(r=>{
      const ex = findExisting(byName[r.branch.toLowerCase()], r);
      if(ex) updates.push({ id:ex.id, r }); else inserts.push(r);
    });
    const nb = Object.keys(newBranches).length;
    if(!confirm(`Import ${rows.length} rows from "${file.name}"?\n\n• ${nb} new branch${nb===1?'':'es'}\n• ${inserts.length} new items\n• ${updates.length} existing items updated (matched by asset tag, serial no, or item name)\n${skipped ? `• ${skipped} rows skipped (missing Branch/Item or invalid Qty)\n` : ''}\nThis cannot be undone — tip: Export Excel first.`)) return;

    if(!(await takeSnapshot('pre-import', false))) return;
    if(nb){
      const { data, error } = await sb.from('branches').insert(Object.values(newBranches).map(n=>({ name:n }))).select();
      if(error) throw error;
      data.forEach(b=>{ byName[b.name.toLowerCase()] = { id:b.id, name:b.name, items:[] }; });
    }
    const now = new Date().toISOString();
    const newRows = inserts.map(r=>({ branch_id:byName[r.branch.toLowerCase()].id, name:r.name, qty:r.qty, serial_no:r.serial_no, asset_tag:r.asset_tag, status:r.status||'In use', assigned_to:r.assigned_to, purchase_date:r.purchase_date, notes:r.notes }));
    for(let i=0;i<newRows.length;i+=200){
      const { error } = await sb.from('items').insert(newRows.slice(i,i+200));
      if(error) throw error;
    }
    for(let i=0;i<updates.length;i+=20){
      const results = await Promise.all(updates.slice(i,i+20).map(({id, r})=>{
        const p = { name:r.name, qty:r.qty, updated_at:now };
        ['serial_no','asset_tag','status','assigned_to','purchase_date','notes'].forEach(f=>{ if(r[f]) p[f] = r[f]; });
        return sb.from('items').update(p).eq('id', id);
      }));
      const bad = results.find(x=>x.error); if(bad) throw bad.error;
    }
    await logAudit('import', `Imported "${file.name}": ${nb} new branches, ${inserts.length} new items, ${updates.length} updated`);
    refreshAudit(); loadAllData();
    alert(`Import done: ${inserts.length} added, ${updates.length} updated${nb ? ', '+nb+' new branches' : ''}.`);
  }catch(e){
    console.error(e); alert('Import failed (some rows may have been applied): ' + (e.message || JSON.stringify(e)));
    loadAllData();
  }finally{
    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-file-arrow-up"></i> Import Excel';
  }
}

/* ---------- Backups (daily snapshots) ---------- */
let backupList = [];
const KIND_LABEL = { auto:'Daily (auto)', manual:'Manual', 'pre-import':'Before import', 'pre-delete':'Before delete', 'pre-restore':'Before restore' };

async function takeSnapshot(kind, silent){
  const fail = (msg)=>{ if(!silent) alert('Could not save a safety backup: '+msg+'\nThe action was cancelled.'); else console.warn('snapshot failed', msg); return false; };
  const [{ data: br, error: be }, { data: it, error: ie }] = await Promise.all([ fetchAll('branches'), fetchAll('items') ]);
  if(be || ie) return fail((be||ie).message);
  const { error } = await sb.from('backups').insert({ kind, created_by:currentUser, branch_count:br.length, item_count:it.length, data:{ version:1, branches:br, items:it } });
  if(error) return fail(error.message);
  return true;
}

async function autoSnapshot(){
  try{
    const start = new Date(); start.setHours(0,0,0,0);
    const { data, error } = await sb.from('backups').select('id').gte('created_at', start.toISOString()).limit(1);
    if(error){ console.warn('backups not available', error.message); return; }
    if(!data.length) await takeSnapshot('auto', true);
    const cutoff = new Date(Date.now() - 30*24*60*60*1000).toISOString();
    await sb.from('backups').delete().lt('created_at', cutoff);
    if(view==='backups') refreshBackups();
  }catch(e){ console.warn('auto snapshot failed', e); }
}

async function refreshBackups(){
  const { data, error } = await sb.from('backups').select('id,created_at,kind,created_by,branch_count,item_count').order('created_at', { ascending:false }).limit(200);
  if(error){
    backupList = [];
    document.getElementById('content').innerHTML = `<h2>Backups</h2><div class="archivedbanner">Could not load backups: ${escapeHtml(error.message)}. Make sure the backups SQL script has been run and you are signed in as an admin.</div>`;
    return;
  }
  backupList = data || [];
  if(view==='backups') renderBackups();
}

function renderBackups(){
  const content = document.getElementById('content');
  content.innerHTML = `
    <h2>Backups</h2>
    <div class="sub">A snapshot is saved automatically the first time an admin opens the app each day, and before every import, permanent delete and restore. The last 30 days are kept.</div>
    <div style="margin-bottom:16px"><button class="primary-btn" id="snapNowBtn"><i class="fa-solid fa-camera"></i> Save snapshot now</button></div>
    ${backupList.length===0 ? '<div class="empty">No snapshots yet.</div>' : `
    <table class="audittable">
      <thead><tr><th>Saved</th><th>Type</th><th>By</th><th style="text-align:right">Branches</th><th style="text-align:right">Items</th><th></th></tr></thead>
      <tbody>${backupList.map(r=>`<tr>
        <td class="ts">${escapeHtml(fmtTs(r.created_at))}</td>
        <td>${escapeHtml(KIND_LABEL[r.kind]||r.kind)}</td>
        <td class="user">${escapeHtml(r.created_by||'')}</td>
        <td class="qty">${r.branch_count}</td><td class="qty">${r.item_count}</td>
        <td style="text-align:right;white-space:nowrap"><button class="ghostbtn" data-a="dl" data-id="${r.id}"><i class="fa-solid fa-file-arrow-down"></i> Excel</button><button class="ghostbtn" data-a="restore" data-id="${r.id}"><i class="fa-solid fa-rotate-left"></i> Restore</button><button class="del" data-a="rm" data-id="${r.id}"><i class="fa-solid fa-trash"></i> delete</button></td>
      </tr>`).join('')}</tbody>
    </table>`}
  `;
  document.getElementById('snapNowBtn').onclick = async ()=>{
    const btn = document.getElementById('snapNowBtn'); btn.disabled = true; btn.textContent = 'Saving…';
    const ok = await takeSnapshot('manual', false);
    if(ok) await logAudit('backup_snapshot', 'Saved a manual snapshot');
    refreshBackups(); refreshAudit();
  };
  content.querySelectorAll('[data-a]').forEach(el=>{
    const id = Number(el.dataset.id);
    el.onclick = ()=>{ if(el.dataset.a==='dl') downloadBackup(id); else if(el.dataset.a==='restore') restoreBackupById(id); else deleteBackup(id); };
  });
}

async function downloadBackup(id){
  if(typeof XLSX === 'undefined'){ alert('Excel library did not load.'); return; }
  const { data, error } = await sb.from('backups').select('created_at,data').eq('id', id).single();
  if(error){ alert('Could not load that snapshot: '+error.message); return; }
  const wb = XLSX.utils.book_new();
  addInventorySheets(wb, nestData(data.data.branches, data.data.items));
  const d = new Date(data.created_at), p = n=>String(n).padStart(2,'0');
  XLSX.writeFile(wb, `ICT-Inventory-Snapshot-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.xlsx`);
}

async function restoreBackupById(id){
  const row = backupList.find(x=>x.id===id); if(!row) return;
  const when = fmtTs(row.created_at);
  const typed = prompt(`RESTORE the snapshot from ${when}?\n\nThis replaces ALL current branches and items with the snapshot (${row.branch_count} branches, ${row.item_count} items). Anything added or changed since then will be lost. A safety backup of the current data is saved first.\n\nType RESTORE to continue:`);
  if(typed !== 'RESTORE') return;
  if(!(await takeSnapshot('pre-restore', false))) return;
  const { error } = await sb.rpc('restore_backup', { p_id:id });
  if(error){ alert('Restore failed: '+error.message); return; }
  await logAudit('restore_backup', `Restored snapshot from ${when} (${row.branch_count} branches, ${row.item_count} items)`);
  selected = null; showArchived = false;
  await refreshBackups(); refreshAudit(); loadAllData();
  alert('Restore complete.');
}

async function deleteBackup(id){
  const row = backupList.find(x=>x.id===id); if(!row) return;
  if(!confirm(`Delete the snapshot from ${fmtTs(row.created_at)}? This cannot be undone.`)) return;
  const { error } = await sb.from('backups').delete().eq('id', id);
  if(error){ alert('Delete failed: '+error.message); return; }
  await logAudit('delete_backup', `Deleted snapshot from ${fmtTs(row.created_at)}`);
  refreshBackups(); refreshAudit();
}

/* ---------- boot ---------- */
let loanList = []; let showReturned = false;
let subscribed = false;
async function boot(){
  render();
  await loadAllData();
  await refreshAudit();
  if(isAdmin()) autoSnapshot();
  if(!subscribed){
    sb.channel('inventory-realtime')
      .on('postgres_changes', { event:'*', schema:'public', table:'items' }, scheduleReload)
      .on('postgres_changes', { event:'*', schema:'public', table:'branches' }, scheduleReload)
      .on('postgres_changes', { event:'*', schema:'public', table:'audit_log' }, refreshAudit)
      .subscribe();
    subscribed = true;
  }
}

async function init(){
  if(typeof supabase === 'undefined'){
    showLogin();
    document.getElementById('loginErr').textContent = 'Could not load the database library — open the downloaded file directly in a browser tab.';
    return;
  }
  const { data } = await sb.auth.getSession();
  if(data && data.session){
    applySession(data.session.user);
    hideLogin();
    boot();
  } else {
    showLogin();
  }
}
init();
